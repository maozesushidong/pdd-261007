x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "10"

x-worker-environment: &worker-environment
  WORKER_EXECUTION_ENABLED: ${WORKER_EXECUTION_ENABLED:-false}
  WORKER_DATA_BACKEND: postgres
  WORKER_RUN_MODE: ${WORKER_RUN_MODE:-shadow}
  WORKER_LIVE_APPROVED: ${WORKER_LIVE_APPROVED:-false}
  WORKER_DYNAMIC_SUPERVISOR: "true"
  WORKER_SUPERVISOR_INTERVAL_MS: ${WORKER_SUPERVISOR_INTERVAL_MS:-5000}
  WORKER_SUPERVISOR_MAX_SHOPS: ${WORKER_SUPERVISOR_MAX_SHOPS:-0}
  WORKER_SCHEDULER_MODE: ${WORKER_SCHEDULER_MODE:-legacy}
  WORKER_SLOT_CAPACITY_MODE: ${WORKER_SLOT_CAPACITY_MODE:-unbounded}
  WORKER_SLOT_HARD_LIMIT: ${WORKER_SLOT_HARD_LIMIT:-0}
  WORKER_SLOT_MEMORY_BUDGET_MB: ${WORKER_SLOT_MEMORY_BUDGET_MB:-1280}
  WORKER_SLOT_RESERVED_MEMORY_MB: ${WORKER_SLOT_RESERVED_MEMORY_MB:-4096}
  WORKER_SLOT_SESSION_MS: ${WORKER_SLOT_SESSION_MS:-600000}
  WORKER_SLOT_LAUNCH_INTERVAL_MS: ${WORKER_SLOT_LAUNCH_INTERVAL_MS:-1000}
  WORKER_HOT_WINDOW_MS: ${WORKER_HOT_WINDOW_MS:-7200000}
  WORKER_HOT_SCAN_INTERVAL_MS: ${WORKER_HOT_SCAN_INTERVAL_MS:-120000}
  WORKER_COLD_SCAN_INTERVAL_MS: ${WORKER_COLD_SCAN_INTERVAL_MS:-600000}
  WORKER_DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
  WORKER_DISPLAY_BASE: ${WORKER_DISPLAY_BASE:-200}
  WORKER_VNC_PORT_BASE: ${WORKER_VNC_PORT_BASE:-5900}
  WORKER_NOVNC_PORT_BASE: ${WORKER_NOVNC_PORT_BASE:-6080}
  WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
  WORKER_MAX_ORDERS: ${WORKER_MAX_ORDERS:-0}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-180}
  WORKER_LEASE_RENEW_MS: ${WORKER_LEASE_RENEW_MS:-60000}
  WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-15000}
  WORKER_BROWSER_HEALTH_CHECK_INTERVAL_MS: ${WORKER_BROWSER_HEALTH_CHECK_INTERVAL_MS:-2500}
  WORKER_BROWSER_HEALTH_TIMEOUT_MS: ${WORKER_BROWSER_HEALTH_TIMEOUT_MS:-60000}
  WORKER_BROWSER_HEALTH_STARTUP_GRACE_MS: ${WORKER_BROWSER_HEALTH_STARTUP_GRACE_MS:-90000}
  WORKER_RESIDENT_BROWSER: ${WORKER_RESIDENT_BROWSER:-true}
  WORKFLOW_BROWSER_HEALTH_INTERVAL_MS: ${WORKFLOW_BROWSER_HEALTH_INTERVAL_MS:-5000}
  WORKFLOW_BROWSER_HEALTH_PROBE_TIMEOUT_MS: ${WORKFLOW_BROWSER_HEALTH_PROBE_TIMEOUT_MS:-4000}
  WORKFLOW_BROWSER_EXTENSION_PATHS: ${WORKFLOW_BROWSER_EXTENSION_PATHS:-}
  WORKFLOW_REQUIRED_EXTENSION_IDS: ${WORKFLOW_REQUIRED_EXTENSION_IDS:-}
  WORKFLOW_BROWSER_EXTENSION_SETTINGS_SEED_ROOT: ${WORKFLOW_BROWSER_EXTENSION_SETTINGS_SEED_ROOT:-}
  WORKFLOW_BROWSER_EXECUTABLE_PATH: ${WORKFLOW_BROWSER_EXECUTABLE_PATH:-}
  WORKFLOW_BROWSER_PROXY_REQUIRED: ${WORKFLOW_BROWSER_PROXY_REQUIRED:-false}
  WORKFLOW_BROWSER_PROXY_SERVER: ${WORKFLOW_BROWSER_PROXY_SERVER:-}
  WORKFLOW_BROWSER_PROXY_BYPASS: ${WORKFLOW_BROWSER_PROXY_BYPASS:-localhost,127.0.0.1,[::1]}
  WORKFLOW_BROWSER_PROXY_USERNAME: ${WORKFLOW_BROWSER_PROXY_USERNAME:-}
  WORKFLOW_BROWSER_PROXY_PASSWORD: ${WORKFLOW_BROWSER_PROXY_PASSWORD:-}
  WORKFLOW_BROWSER_PROXY_EXPIRES_AT: ${WORKFLOW_BROWSER_PROXY_EXPIRES_AT:-}
  WORKER_BROWSER_PROXY_PROBE_TIMEOUT_MS: ${WORKER_BROWSER_PROXY_PROBE_TIMEOUT_MS:-5000}
  WORKER_BROWSER_PROXY_RETRY_MS: ${WORKER_BROWSER_PROXY_RETRY_MS:-30000}
  WORKFLOW_BROWSER_ALWAYS_LOAD_EXTENSIONS: ${WORKFLOW_BROWSER_ALWAYS_LOAD_EXTENSIONS:-false}
  PDD_DISCOVERY_INTERVAL_MS: ${PDD_DISCOVERY_INTERVAL_MS:-60000}
  PDD_ACTION_DELAY_MS: ${PDD_ACTION_DELAY_MS:-900}
  OMS_ACTION_DELAY_MS: ${OMS_ACTION_DELAY_MS:-250}
  TMS_ACTION_DELAY_MS: ${TMS_ACTION_DELAY_MS:-250}
  WORKFLOW_ACTION_DELAY_MS: ${WORKFLOW_ACTION_DELAY_MS:-250}
  OMS_READY_POLL_MS: ${OMS_READY_POLL_MS:-250}
  TMS_CREATED_ROW_POLL_INTERVAL_MS: ${TMS_CREATED_ROW_POLL_INTERVAL_MS:-1000}
  WORKFLOW_HUMAN_VERIFICATION_POLL_MS: ${WORKFLOW_HUMAN_VERIFICATION_POLL_MS:-250}
  WORKFLOW_HUMAN_VERIFICATION_CLEAR_STABLE_MS: ${WORKFLOW_HUMAN_VERIFICATION_CLEAR_STABLE_MS:-500}
  PDD_QUERY_SETTLE_MS: ${PDD_QUERY_SETTLE_MS:-8000}
  PDD_DETAIL_SETTLE_MS: ${PDD_DETAIL_SETTLE_MS:-10000}
  PDD_LOGISTICS_SETTLE_MS: ${PDD_LOGISTICS_SETTLE_MS:-8000}
  PDD_SUBMIT_SETTLE_MS: ${PDD_SUBMIT_SETTLE_MS:-30000}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-pdd-workflow-production}
  S3_ACCESS_KEY_FILE: /run/workflow-secrets/S3_ACCESS_KEY
  S3_SECRET_KEY_FILE: /run/workflow-secrets/S3_SECRET_KEY
  WORKFLOW_DATA_ROOT: /var/lib/pdd-workflow
  WORKFLOW_BROWSER_MODE: server-headed
  WORKFLOW_CLEAR_FOREIGN_PROFILE_LOCK: true
  PDD_LOGIN_MODE: manual
  OMS_MODE: ${OMS_MODE:-per-shop}
  WORKFLOW_SECRETS_DIR: /run/workflow-secrets
  PDD_HEALTHCARE_ACCOUNT_FILE: /run/workflow-secrets/PDD_HEALTHCARE_ACCOUNT
  PDD_HEALTHCARE_PASSWORD_FILE: /run/workflow-secrets/PDD_HEALTHCARE_PASSWORD
  PDD_MEDICAL_DEVICE_ACCOUNT_FILE: /run/workflow-secrets/PDD_MEDICAL_DEVICE_ACCOUNT
  PDD_MEDICAL_DEVICE_PASSWORD_FILE: /run/workflow-secrets/PDD_MEDICAL_DEVICE_PASSWORD
  PDD_SONGTENG_YAZC_ACCOUNT_FILE: /run/workflow-secrets/PDD_SONGTENG_YAZC_ACCOUNT
  PDD_SONGTENG_YAZC_PASSWORD_FILE: /run/workflow-secrets/PDD_SONGTENG_YAZC_PASSWORD
  JEOMS_ACCOUNT_FILE: /run/workflow-secrets/JEOMS_ACCOUNT
  JEOMS_PASSWORD_FILE: /run/workflow-secrets/JEOMS_PASSWORD
  TMS_ACCOUNT_FILE: /run/workflow-secrets/TMS_ACCOUNT
  TMS_PASSWORD_FILE: /run/workflow-secrets/TMS_PASSWORD

x-worker-common: &worker-common
  profiles: ["worker"]
  image: ${WORKER_IMAGE:-pdd-workflow-worker:v1.0.0}
  restart: unless-stopped
  init: true
  environment:
    <<: *worker-environment
  depends_on:
    db-migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    display:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "apps/worker/src/healthcheck.mjs"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 45s
  shm_size: 2gb
  mem_limit: 4g
  cpus: 2.5
  pids_limit: 768
  logging: *default-logging

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workorders}
      POSTGRES_USER: ${POSTGRES_USER:-workorders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 300
    logging: *default-logging

  db-migrate:
    image: ${POSTGRES_IMAGE:-postgres:16.4-bookworm}
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-workorders}
      PGUSER: ${POSTGRES_USER:-workorders}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ../db/migrations:/migrations:ro
      - ../db/run-migrations.sh:/run-migrations.sh:ro
    command: ["/bin/sh", "/run-migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  redis:
    image: redis:7.4.2-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "100"]
    volumes:
      - redis-production-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 150
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.production}
    volumes:
      - minio-production-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 300
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.production}
      S3_BUCKET: ${S3_BUCKET:-pdd-workflow-production}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    logging: *default-logging

  api:
    image: ${API_IMAGE:-pdd-workflow-api:v1.0.0}
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATA_BACKEND: postgres
      DEPLOYMENT_STAGE: ${DEPLOYMENT_STAGE:-PROD}
      DEPLOYMENT_PLATFORM: ${DEPLOYMENT_PLATFORM:-Linux Server}
      APP_VERSION: ${APP_VERSION:-v1.0.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      COOKIE_SECURE: "true"
      WORKFLOW_DATA_ROOT: /var/lib/pdd-workflow
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-pdd-workflow-production}
      S3_ACCESS_KEY_FILE: /run/workflow-secrets/S3_ACCESS_KEY
      S3_SECRET_KEY_FILE: /run/workflow-secrets/S3_SECRET_KEY
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD_FILE: /run/workflow-secrets/OWNER_PASSWORD
      OWNER_SESSION_SECRET_FILE: /run/workflow-secrets/OWNER_SESSION_SECRET
      WORKER_INGEST_TOKEN_FILE: /run/workflow-secrets/WORKER_INGEST_TOKEN
      VERIFICATION_SCREENSHOT_RETENTION_DAYS: ${VERIFICATION_SCREENSHOT_RETENTION_DAYS:-7}
      PDD_TMS_SCREENSHOT_RETENTION_DAYS: ${PDD_TMS_SCREENSHOT_RETENTION_DAYS:-7}
    volumes:
      - workflow-production-data:/var/lib/pdd-workflow:ro
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}:/run/workflow-secrets:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 250
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-pdd-workflow-web:v1.0.0}
    restart: unless-stopped
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 4173
      API_BASE_URL: http://api:3000
      REMOTE_DESKTOP_BASE_URL: http://worker:6080
      REMOTE_DESKTOP_MAX_SLOTS: ${REMOTE_DESKTOP_MAX_SLOTS:-1000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    logging: *default-logging

  display:
    profiles: ["legacy-visual"]
    image: ${DESKTOP_IMAGE:-pdd-workflow-desktop:v1.0.0}
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac &
        Xvfb :100 -screen 0 1920x1080x24 -nolisten tcp -ac &
        Xvfb :101 -screen 0 1920x1080x24 -nolisten tcp -ac &
        DISPLAY=:99 openbox-session >/tmp/openbox-healthcare.log 2>&1 &
        DISPLAY=:100 openbox-session >/tmp/openbox-medical-device.log 2>&1 &
        DISPLAY=:101 openbox-session >/tmp/openbox-songteng.log 2>&1 &
        exec tail -f /dev/null
    volumes:
      - x11-production-socket:/tmp/.X11-unix
    healthcheck:
      test: ["CMD-SHELL", "xdpyinfo -display :99 >/dev/null 2>&1 && xdpyinfo -display :100 >/dev/null 2>&1 && xdpyinfo -display :101 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 250
    logging: *default-logging

  vnc:
    profiles: ["legacy-visual"]
    image: ${DESKTOP_IMAGE:-pdd-workflow-desktop:v1.0.0}
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        x11vnc -display :99 -forever -shared -listen 0.0.0.0 -rfbport 5900 -nopw -noshm -noxdamage -modtweak -xkb -capslock -add_keysyms -clear_all -repeat -speeds lan -wait 5 -defer 5 &
        x11vnc -display :100 -forever -shared -listen 0.0.0.0 -rfbport 5901 -nopw -noshm -noxdamage -modtweak -xkb -capslock -add_keysyms -clear_all -repeat -speeds lan -wait 5 -defer 5 &
        exec x11vnc -display :101 -forever -shared -listen 0.0.0.0 -rfbport 5902 -nopw -noshm -noxdamage -modtweak -xkb -capslock -add_keysyms -clear_all -repeat -speeds lan -wait 5 -defer 5
    volumes:
      - x11-production-socket:/tmp/.X11-unix
    depends_on:
      display:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 150
    logging: *default-logging

  novnc-healthcare: &novnc-common
    profiles: ["legacy-visual"]
    image: ${DESKTOP_IMAGE:-pdd-workflow-desktop:v1.0.0}
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        sed -i "s#UI.initSetting('path', 'websockify')#UI.initSetting('path', 'vnc/healthcare/websockify')#" /usr/share/novnc/app/ui.js &&
        exec websockify --web=/usr/share/novnc 6080 vnc:5900
    depends_on:
      vnc:
        condition: service_started
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 100
    logging: *default-logging

  novnc-medical-device:
    <<: *novnc-common
    command:
      - /bin/sh
      - -c
      - >-
        sed -i "s#UI.initSetting('path', 'websockify')#UI.initSetting('path', 'vnc/medical-device/websockify')#" /usr/share/novnc/app/ui.js &&
        exec websockify --web=/usr/share/novnc 6080 vnc:5901

  novnc-songteng:
    <<: *novnc-common
    command:
      - /bin/sh
      - -c
      - >-
        sed -i "s#UI.initSetting('path', 'websockify')#UI.initSetting('path', 'vnc/songteng/websockify')#" /usr/share/novnc/app/ui.js &&
        exec websockify --web=/usr/share/novnc 6080 vnc:5902

  gateway:
    profiles: ["visual"]
    image: ${GATEWAY_IMAGE:-pdd-workflow-gateway:v1.0.0}
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-10443}:10443"
    volumes:
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}/GATEWAY_TLS_CERT:/etc/nginx/tls/server.crt:ro
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}/GATEWAY_TLS_KEY:/etc/nginx/tls/server.key:ro
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}/GATEWAY_HTPASSWD:/etc/nginx/auth/htpasswd:ro
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10443"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 150
    logging: *default-logging

  notifier:
    profiles: ["notifications"]
    image: ${API_IMAGE:-pdd-workflow-api:v1.0.0}
    restart: unless-stopped
    command: ["node", "scripts/dingtalk-dispatcher.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      DINGTALK_NOTIFICATIONS_ENABLED: ${DINGTALK_NOTIFICATIONS_ENABLED:-false}
      DINGTALK_POLL_INTERVAL_MS: ${DINGTALK_POLL_INTERVAL_MS:-15000}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-https://47.96.184.148:10443}
      DINGTALK_WEBHOOK_FILE: /run/workflow-secrets/DINGTALK_WEBHOOK
      DINGTALK_SIGNING_SECRET_FILE: /run/workflow-secrets/DINGTALK_SIGNING_SECRET
      DINGTALK_RECIPIENTS_FILE: /run/workflow-secrets/DINGTALK_RECIPIENTS
      DINGTALK_RETURN_REFUND_RECIPIENTS_FILE: /run/workflow-secrets/DINGTALK_RETURN_REFUND_RECIPIENTS
    volumes:
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}:/run/workflow-secrets:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "import('pg').then(async ({default:pg})=>{const pool=new pg.Pool({connectionString:process.env.DATABASE_URL});try{await pool.query('SELECT 1')}finally{await pool.end()}}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100
    logging: *default-logging

  worker-healthcare:
    <<: *worker-common
    profiles: ["legacy-worker"]
    environment:
      <<: *worker-environment
      WORKER_ID: production-postgres-worker-healthcare
      WORKER_SHOP_ID: panapopo-healthcare
      DISPLAY: :99
    volumes:
      - workflow-healthcare-data:/var/lib/pdd-workflow/shops/panapopo-healthcare
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}:/run/workflow-secrets:ro
      - x11-production-socket:/tmp/.X11-unix

  worker-medical-device:
    <<: *worker-common
    profiles: ["legacy-worker"]
    environment:
      <<: *worker-environment
      WORKER_ID: production-postgres-worker-medical-device
      WORKER_SHOP_ID: panapopo-medical-device
      DISPLAY: :100
    volumes:
      - workflow-medical-device-data:/var/lib/pdd-workflow/shops/panapopo-medical-device
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}:/run/workflow-secrets:ro
      - x11-production-socket:/tmp/.X11-unix

  worker-songteng:
    <<: *worker-common
    profiles: ["legacy-worker"]
    environment:
      <<: *worker-environment
      WORKER_ID: production-postgres-worker-songteng
      WORKER_SHOP_ID: songteng-yazc-overseas
      DISPLAY: :101
    volumes:
      - workflow-songteng-data:/var/lib/pdd-workflow/shops/songteng-yazc-overseas
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}:/run/workflow-secrets:ro
      - x11-production-socket:/tmp/.X11-unix

  worker:
    profiles: ["worker"]
    image: ${WORKER_IMAGE:-pdd-workflow-worker:v1.0.0}
    restart: unless-stopped
    stop_grace_period: 3m
    init: true
    environment:
      <<: *worker-environment
      WORKER_ID: ${WORKER_ID:-production-postgres-worker}
      WORKER_HEARTBEAT_FILE: /tmp/pdd-worker-supervisor-heartbeat.json
    volumes:
      - workflow-production-data:/var/lib/pdd-workflow
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}:/run/workflow-secrets:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/src/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 1gb
    mem_limit: ${WORKER_MEMORY_LIMIT:-6g}
    cpus: ${WORKER_CPU_LIMIT:-4.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-1536}
    logging: *default-logging

  worker-sync:
    profiles: ["worker"]
    image: ${WORKER_IMAGE:-pdd-workflow-worker:v1.0.0}
    restart: unless-stopped
    command: ["node", "scripts/sync-windows-worker-state.mjs"]
    environment:
      WORKFLOW_DATA_ROOT: /var/lib/pdd-workflow
      WORKER_SYNC_API_URL: http://api:3000
      WORKER_SYNC_SOURCE_ID: production-docker-worker
      WORKER_SYNC_INTERVAL_MS: ${WORKER_SYNC_INTERVAL_MS:-1000}
      WORKER_INGEST_TOKEN_FILE: /run/workflow-secrets/WORKER_INGEST_TOKEN
    volumes:
      - workflow-production-data:/var/lib/pdd-workflow
      - ${WORKFLOW_SECRETS_DIR:-/etc/pdd-workflow/secrets}:/run/workflow-secrets:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const state=JSON.parse(fs.readFileSync('/var/lib/pdd-workflow/sync/windows-worker-state.json','utf8'));const age=Date.now()-Date.parse(state.lastSuccessAt);if(!Number.isFinite(age)||age>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100
    logging: *default-logging

volumes:
  postgres-production-data:
  redis-production-data:
  minio-production-data:
  workflow-production-data:
  workflow-healthcare-data:
  workflow-medical-device-data:
  workflow-songteng-data:
  x11-production-socket:
